[[override]]
id = "machine-item-capability.heater-insert-record"
note = "统一验收独立审阅（reviewer，Opus high）记作记录项：核心下方的输入器把流体标识放进了燃油加热器（True）。原版不向自动化开放任何槽（TileEntityMachineBase.java:138-140），NEO 的 HeaterOilburnerBlockEntity.getSlotsForFace 返回 0–2（HeaterOilburnerBlockEntity.java:204-208）；28A 静态审阅已记为保留 NEO 既有的访问（migration/goal28a-static-review.md:19），没有找到用户明确同意这处偏离的记录，收口时与 G-53 一起处置。收口 2026-11-19：用户对“燃油加热器现在允许漏斗等自动化往里放物品（不能取出），原版完全不向自动化开放……怎么办？”答“还有别的支持自动化的加热器吗？我倾向于保留一些可以自动化的加热器，假如有电加热器就无所谓按照原版改即可”；NEO 有电加热器，火箱与加热炉原版就收自动化放的固体燃料，这处偏离已由小修之二十一照原版改掉（HeaterOilburnerBlockEntity.getSlotsForFace 返回空数组，原版 TileEntityMachineBase.java:127-140）。改后没有重跑本场景，也没有实机看过；回归由收口包最终链里的 GameTest fluid_burner（NetherEndWorldgenGameTests）承担；本行记录的是改之前的行为"

