# Hand-placed rows of the Goal 32 master list: the "主清单候选" sections of GOAL32A-D, GOAL32S
# section 八 and GOAL32T section 八, the rows GOAL32G 起点核对 asks to add, the stability and
# old-save rows, the radio torch row and the release-form check. Scenario rows are NOT here:
# they come from results.json through mapping.toml.
#
# [[row]]       one master-list row (one expectation)
#   id          unique expectation id (provisional ids start with "pending." until the lane names them)
#   source      出处
#   lane        one of: 只留 GameTest（规则 2）/ 脚本（单人）/ 脚本（专服）/ 用户站点 / 游戏外脚本
#   target      场景、测试或站点 text
#   gametests   ["Class.method", ...] checked by the generator: method exists under
#               src/main/java/com/hbm/gametest/ and ran and passed in the final-chain GameTest log
#   result      批次结果 text (ignored when gametests are given; the check result is written)
#   group       统一验收的运行组
#   timing      用时来源
#   pending     lane of this batch that still has to produce the row
#   covers      scenario expectation ids that carry this candidate's client side (cross-check only)
#   note        appended to the result (reason a row is still pending, defect or ordering notes)
#   filled_by   lane of this batch that produced the row; run: its run name; verdict: for the counts only
#
# [[replaced]]  where a placeholder went: old id, new ids (rows of the table), lane, why; `kept = true` (or no
#               new ids) when the old row stays in the table and `why` says why
#
# [[annotate]]  adds a source label to a scenario row (the candidate's client side is that row)
# [[override]]  changes lane/group/pending/note of a scenario row by expectation id

