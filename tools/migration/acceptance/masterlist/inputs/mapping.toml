# Scenario file -> run directory for the Goal 32 master list (GOAL32G-ACCEPTANCE.md).
#
# One [[run]] per scenario file. The generator reads results.json (and judgments.json when the
# run has one) from build/migration/acceptance-runs/<run>/ or build/migration/goal32t/scenarios/<run>/
# (or the explicit `dir`), takes the scenario whose ref equals `scenario`, and writes one row per
# expectation. To rebuild after a lane reruns a file, change `run` here (or pass
# --map <scenario>=<run> on the command line) and clear `pending`.
#
# Fields:
#   scenario  scenario ref (path under tools/migration/acceptance/scenarios without .py)
#   run       run name whose result is the batch result
#   history   earlier runs of the same file; a different verdict there is shown as "此前"
#   source    出处 column
#   lane      one of the five lanes
#   group     统一验收的运行组
#   pending   lane name of this batch that is still changing the file (rows marked 待重跑)
#   only      restrict to these expectation ids (Goal 31 files that Goal 32 touched only in part)
#   filled_by lane of this batch whose final run this is (report.md "本批各道填入的行")
#   note      appended to the result of every row of the file

